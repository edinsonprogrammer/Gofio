; Supervisor — worker de colas Gofio (copiar a /etc/supervisor/conf.d/)
; Ajusta rutas y usuario según el VPS.

[program:gofio-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gofio/artisan queue:work redis --sleep=3 --tries=3 --max-jobs=1000
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/gofio/storage/logs/worker.log
stopwaitsecs=3600
